<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#glow1)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#262626" stroke-width="1" stroke-dasharray="4 8" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Stage Lighting & Conclave Podium Mockup -->
  <g transform="translate(100, 80)">
    <!-- Main Stage Screen -->
    <rect x="50" y="30" width="500" height="260" rx="8" fill="#181818" stroke="#333333" stroke-width="1.5"/>
    <text x="300" y="110" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="0.15em" fill="#FFFFFF">E-SUMMIT UIET</text>
    <text x="300" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.25em" fill="#888888">DISRUPT • ACCELERATE • SCALE</text>
    
    <!-- Stage spotlights -->
    <path d="M120 20 L250 240 L190 240 Z" fill="#ffffff" opacity="0.04"/>
    <path d="M480 20 L350 240 L410 240 Z" fill="#ffffff" opacity="0.04"/>
    
    <!-- Live Badges -->
    <rect x="70" y="240" width="110" height="28" rx="14" fill="#222222" stroke="#444444"/>
    <circle cx="86" cy="254" r="4" fill="#00E676"/>
    <text x="98" y="258" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#EEEEEE">30+ LEADERS</text>
    
    <rect x="420" y="240" width="110" height="28" rx="14" fill="#222222" stroke="#444444"/>
    <text x="475" y="258" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#EEEEEE">5,000+ FOOTFALL</text>
  </g>
</svg>
