<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#1C1A17"/>
  <!-- Graph Paper Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2B2722" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Rough Napkin Sketch Graphic -->
  <g transform="translate(160, 100)">
    <!-- Napkin Card -->
    <rect x="0" y="0" width="480" height="380" rx="4" fill="#F8F6F0" stroke="#D1C7BD" stroke-width="2"/>
    <text x="40" y="55" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#3D3730">[DAY 0: DORM ROOM NOTE]</text>
    
    <!-- Hand-drawn style diagram -->
    <rect x="40" y="90" width="160" height="90" rx="4" fill="none" stroke="#60584F" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="120" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#60584F">Student Idea (IoT/AI)</text>
    
    <path d="M 210 135 L 260 135" stroke="#60584F" stroke-width="2"/>
    
    <circle cx="340" cy="135" r="45" fill="none" stroke="#60584F" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="340" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#60584F">Target Users?</text>
    
    <!-- Rough notes -->
    <text x="40" y="240" font-family="'Courier New', monospace" font-size="14" fill="#3D3730">• No funding yet</text>
    <text x="40" y="270" font-family="'Courier New', monospace" font-size="14" fill="#3D3730">• Just two 2nd year UIET engineers</text>
    <text x="40" y="300" font-family="'Courier New', monospace" font-size="14" fill="#3D3730">• Unclear go-to-market strategy</text>
    <text x="40" y="340" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#B33927">"Walked into E-Cell Incubator &gt;&gt;"</text>
  </g>
</svg>
